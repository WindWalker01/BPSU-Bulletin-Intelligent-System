services:
  - type: web
    name: bulletin-intelligent-system
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bulletin-db
          property: connectionString

databases:
  - name: bulletin-db
    databaseName: bulletin
    user: bulletin_user
